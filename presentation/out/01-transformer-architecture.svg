<?xml version="1.0" encoding="UTF-8"?>
<svg class="slide" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A decoder-only transformer: tokens are embedded, refined by N blocks of attention and MLP on the residual stream, normalised, projected onto the vocabulary as logits, and turned into probabilities by softmax">
<style>@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: block; src: url('../fonts/IBMPlexMono-400.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: block; src: url('../fonts/IBMPlexMono-500.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; font-display: block; src: url('../fonts/IBMPlexSans-400.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 500; font-display: block; src: url('../fonts/IBMPlexSans-500.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; font-display: block; src: url('../fonts/IBMPlexSans-600.woff2') format('woff2'); }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#AEB6C7"></path>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"></path>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#0E1016"></rect>

  <!-- header -->
  <text x="96" y="92" font-family="IBM Plex Mono, monospace" font-size="22" fill="#7C8599" letter-spacing="2">01 · ARCHITECTURE</text>
  <text x="96" y="152" font-size="52" font-weight="600" fill="#ECEFF4">A decoder-only transformer, end to end</text>
  <text x="96" y="196" font-size="26" fill="#AEB6C7">Numbers are Qwen2.5-0.5B: d = 896, 24 layers, |V| = 151,936 tokens</text>

  <!-- stage 1: tokens -->
  <g font-family="IBM Plex Mono, monospace" font-size="24">
    <text x="96" y="330" font-size="22" fill="#7C8599" font-family="IBM Plex Sans, sans-serif">1 · Tokens</text>
    <rect x="96" y="352" width="70" height="46" rx="8" fill="#171A22" stroke="#2A2F3C"></rect>
    <text x="131" y="383" text-anchor="middle" fill="#ECEFF4">Ada</text>
    <rect x="96" y="410" width="70" height="46" rx="8" fill="#171A22" stroke="#2A2F3C"></rect>
    <text x="131" y="441" text-anchor="middle" fill="#ECEFF4">␠is</text>
    <rect x="96" y="468" width="70" height="46" rx="8" fill="#171A22" stroke="#2A2F3C"></rect>
    <text x="131" y="499" text-anchor="middle" fill="#ECEFF4">␠36</text>
    <rect x="96" y="526" width="70" height="46" rx="8" fill="#171A22" stroke="#2A2F3C"></rect>
    <text x="131" y="557" text-anchor="middle" fill="#ECEFF4">.</text>
    <rect x="96" y="584" width="70" height="46" rx="8" fill="#171A22" stroke="#2DD4BF" stroke-width="2"></rect>
    <text x="131" y="615" text-anchor="middle" fill="#2DD4BF">{</text>
    <text x="96" y="672" font-size="20" fill="#7C8599" font-family="IBM Plex Sans, sans-serif">token ids</text>
  </g>
  <line x1="176" y1="490" x2="236" y2="490" stroke="#AEB6C7" stroke-width="2" marker-end="url(#arrow)"></line>

  <!-- stage 2: embeddings -->
  <g>
    <text x="250" y="330" font-size="22" fill="#7C8599">2 · Embedding + position</text>
    <rect x="250" y="352" width="190" height="278" rx="12" fill="#171A22" stroke="#2A2F3C"></rect>
    <g fill="#3987E5" opacity="0.9">
      <rect x="272" y="372" width="146" height="8" rx="2"></rect><rect x="272" y="386" width="146" height="8" rx="2"></rect><rect x="272" y="400" width="146" height="8" rx="2"></rect>
      <rect x="272" y="430" width="146" height="8" rx="2"></rect><rect x="272" y="444" width="146" height="8" rx="2"></rect><rect x="272" y="458" width="146" height="8" rx="2"></rect>
      <rect x="272" y="488" width="146" height="8" rx="2"></rect><rect x="272" y="502" width="146" height="8" rx="2"></rect><rect x="272" y="516" width="146" height="8" rx="2"></rect>
      <rect x="272" y="546" width="146" height="8" rx="2"></rect><rect x="272" y="560" width="146" height="8" rx="2"></rect><rect x="272" y="574" width="146" height="8" rx="2"></rect>
    </g>
    <text x="345" y="612" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" fill="#AEB6C7">5 × 896</text>
    <text x="250" y="672" font-size="20" fill="#7C8599">one vector per token,</text>
    <text x="250" y="700" font-size="20" fill="#7C8599">rotary positions</text>
  </g>
  <line x1="450" y1="490" x2="510" y2="490" stroke="#AEB6C7" stroke-width="2" marker-end="url(#arrow)"></line>

  <!-- stage 3: blocks on the residual stream -->
  <g>
    <text x="524" y="330" font-size="22" fill="#7C8599">3 · N transformer blocks on the residual stream</text>
    <rect x="524" y="352" width="720" height="278" rx="12" fill="#171A22" stroke="#2A2F3C"></rect>
    <!-- residual stream -->
    <line x1="548" y1="590" x2="1220" y2="590" stroke="#2DD4BF" stroke-width="5" stroke-linecap="round"></line>
    <text x="1220" y="618" text-anchor="end" font-size="18" fill="#2DD4BF">residual stream (d = 896)</text>
    <!-- three blocks -->
    <g>
      <rect x="560" y="380" width="180" height="170" rx="10" fill="#0E1016" stroke="#3A4152"></rect>
      <rect x="576" y="396" width="148" height="56" rx="6" fill="#1E2330" stroke="#3A4152"></rect>
      <text x="650" y="430" text-anchor="middle" font-size="20" fill="#ECEFF4">masked self-attn</text>
      <rect x="576" y="470" width="148" height="56" rx="6" fill="#1E2330" stroke="#3A4152"></rect>
      <text x="650" y="504" text-anchor="middle" font-size="20" fill="#ECEFF4">MLP</text>
      <line x1="650" y1="590" x2="650" y2="556" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow-teal)"></line>
    </g>
    <g>
      <rect x="790" y="380" width="180" height="170" rx="10" fill="#0E1016" stroke="#3A4152"></rect>
      <rect x="806" y="396" width="148" height="56" rx="6" fill="#1E2330" stroke="#3A4152"></rect>
      <text x="880" y="430" text-anchor="middle" font-size="20" fill="#ECEFF4">masked self-attn</text>
      <rect x="806" y="470" width="148" height="56" rx="6" fill="#1E2330" stroke="#3A4152"></rect>
      <text x="880" y="504" text-anchor="middle" font-size="20" fill="#ECEFF4">MLP</text>
      <line x1="880" y1="590" x2="880" y2="556" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow-teal)"></line>
    </g>
    <text x="1030" y="474" text-anchor="middle" font-size="34" fill="#7C8599">···</text>
    <g>
      <rect x="1040" y="380" width="180" height="170" rx="10" fill="#0E1016" stroke="#3A4152"></rect>
      <rect x="1056" y="396" width="148" height="56" rx="6" fill="#1E2330" stroke="#3A4152"></rect>
      <text x="1130" y="430" text-anchor="middle" font-size="20" fill="#ECEFF4">masked self-attn</text>
      <rect x="1056" y="470" width="148" height="56" rx="6" fill="#1E2330" stroke="#3A4152"></rect>
      <text x="1130" y="504" text-anchor="middle" font-size="20" fill="#ECEFF4">MLP</text>
      <line x1="1130" y1="590" x2="1130" y2="556" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrow-teal)"></line>
    </g>
    <text x="524" y="672" font-size="20" fill="#7C8599">each block reads the stream, adds a correction back: x ← x + attn(x); x ← x + mlp(x)</text>
    <text x="524" y="700" font-size="20" fill="#7C8599">× 24 layers · every position attends only to positions before it</text>
  </g>
  <line x1="1254" y1="490" x2="1314" y2="490" stroke="#AEB6C7" stroke-width="2" marker-end="url(#arrow)"></line>

  <!-- stage 4: last vector → LM head → logits -->
  <g>
    <text x="1328" y="330" font-size="22" fill="#7C8599">4 · Output layer</text>
    <rect x="1328" y="352" width="496" height="278" rx="12" fill="#171A22" stroke="#2A2F3C"></rect>
    <!-- last hidden vector -->
    <rect x="1352" y="372" width="34" height="238" rx="6" fill="#1E2330" stroke="#3A4152"></rect>
    <g fill="#2DD4BF"><rect x="1360" y="382" width="18" height="8" rx="2"></rect><rect x="1360" y="396" width="18" height="8" rx="2"></rect><rect x="1360" y="410" width="18" height="8" rx="2"></rect><rect x="1360" y="424" width="18" height="8" rx="2"></rect><rect x="1360" y="438" width="18" height="8" rx="2"></rect><rect x="1360" y="452" width="18" height="8" rx="2"></rect><rect x="1360" y="466" width="18" height="8" rx="2"></rect><rect x="1360" y="480" width="18" height="8" rx="2"></rect><rect x="1360" y="494" width="18" height="8" rx="2"></rect><rect x="1360" y="508" width="18" height="8" rx="2"></rect><rect x="1360" y="522" width="18" height="8" rx="2"></rect><rect x="1360" y="536" width="18" height="8" rx="2"></rect><rect x="1360" y="550" width="18" height="8" rx="2"></rect><rect x="1360" y="564" width="18" height="8" rx="2"></rect><rect x="1360" y="578" width="18" height="8" rx="2"></rect></g>
    <text x="1369" y="646" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#AEB6C7">h</text>
    <text x="1369" y="670" text-anchor="middle" font-size="16" fill="#7C8599">last position</text>
    <line x1="1396" y1="490" x2="1436" y2="490" stroke="#AEB6C7" stroke-width="2" marker-end="url(#arrow)"></line>
    <!-- LM head -->
    <rect x="1446" y="430" width="120" height="120" rx="8" fill="#1E2330" stroke="#3A4152"></rect>
    <text x="1506" y="480" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="22" fill="#ECEFF4">W_U</text>
    <text x="1506" y="508" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" fill="#AEB6C7">151,936 × 896</text>
    <text x="1506" y="646" text-anchor="middle" font-size="18" fill="#7C8599">RMSNorm · LM head</text>
    <line x1="1576" y1="490" x2="1616" y2="490" stroke="#AEB6C7" stroke-width="2" marker-end="url(#arrow)"></line>
    <!-- logits column -->
    <g>
      <rect x="1626" y="372" width="60" height="238" rx="6" fill="#1E2330" stroke="#3A4152"></rect>
      <g fill="#3987E5">
        <rect x="1634" y="384" width="44" height="6"></rect><rect x="1634" y="394" width="12" height="6"></rect><rect x="1634" y="404" width="30" height="6"></rect><rect x="1634" y="414" width="8" height="6"></rect><rect x="1634" y="424" width="22" height="6"></rect><rect x="1634" y="434" width="4" height="6"></rect><rect x="1634" y="444" width="36" height="6"></rect><rect x="1634" y="454" width="10" height="6"></rect><rect x="1634" y="464" width="6" height="6"></rect><rect x="1634" y="474" width="26" height="6"></rect><rect x="1634" y="484" width="14" height="6"></rect><rect x="1634" y="494" width="4" height="6"></rect><rect x="1634" y="504" width="18" height="6"></rect><rect x="1634" y="514" width="8" height="6"></rect><rect x="1634" y="524" width="40" height="6"></rect><rect x="1634" y="534" width="6" height="6"></rect><rect x="1634" y="544" width="12" height="6"></rect><rect x="1634" y="554" width="20" height="6"></rect><rect x="1634" y="564" width="4" height="6"></rect><rect x="1634" y="574" width="16" height="6"></rect><rect x="1634" y="584" width="10" height="6"></rect><rect x="1634" y="594" width="30" height="6"></rect>
      </g>
      <text x="1656" y="646" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#AEB6C7">z</text>
      <text x="1656" y="670" text-anchor="middle" font-size="16" fill="#7C8599">151,936 logits</text>
    </g>
    <line x1="1696" y1="490" x2="1736" y2="490" stroke="#AEB6C7" stroke-width="2" marker-end="url(#arrow)"></line>
    <rect x="1746" y="440" width="66" height="100" rx="8" fill="#1E2330" stroke="#3A4152"></rect>
    <text x="1779" y="484" text-anchor="middle" font-size="16" fill="#ECEFF4">soft</text>
    <text x="1779" y="506" text-anchor="middle" font-size="16" fill="#ECEFF4">max</text>
    <text x="1779" y="646" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#AEB6C7">p</text>
    <text x="1779" y="670" text-anchor="middle" font-size="16" fill="#7C8599">sample</text>
  </g>

  <!-- feedback loop -->
  <path d="M1779,700 L1779,760 L60,760 L60,607 L86,607" fill="none" stroke="#3A4152" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"></path>
  <text x="960" y="790" text-anchor="middle" font-size="22" fill="#AEB6C7">the sampled token is appended to the input and the whole thing runs again: one forward pass per generated token</text>

  <!-- footer takeaway -->
  <rect x="96" y="860" width="1728" height="120" rx="12" fill="#171A22" stroke="#2A2F3C"></rect>
  <text x="128" y="906" font-size="26" font-weight="600" fill="#ECEFF4">Everything structured output does happens in the last centimetre of this picture.</text>
  <text x="128" y="946" font-size="24" fill="#AEB6C7">The blocks are untouched. Only the logits vector z is edited, right before softmax, once per token.</text>
</svg>
