<?xml version="1.0" encoding="UTF-8"?>
<svg class="slide" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Twelve candidate next tokens: on the left their raw logits, which can be negative and close together; on the right the softmax probabilities, where small logit gaps become large probability gaps">
<style>@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: block; src: url('../fonts/IBMPlexMono-400.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: block; src: url('../fonts/IBMPlexMono-500.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; font-display: block; src: url('../fonts/IBMPlexSans-400.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 500; font-display: block; src: url('../fonts/IBMPlexSans-500.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; font-display: block; src: url('../fonts/IBMPlexSans-600.woff2') format('woff2'); }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#AEB6C7"></path>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#0E1016"></rect>

  <text x="96" y="92" font-family="IBM Plex Mono, monospace" font-size="22" fill="#7C8599" letter-spacing="2">03 · LOGITS → PROBABILITIES</text>
  <text x="96" y="152" font-size="52" font-weight="600" fill="#ECEFF4">Softmax turns scores into a distribution</text>
  <text x="96" y="196" font-size="26" fill="#AEB6C7">Prompt: “Extract the person as JSON: Ada Lovelace, 36, London.” — the model's top 12 candidates for the first token</text>

  <!-- LEFT: raw logits -->
  <g>
    <text x="96" y="272" font-size="24" font-weight="600" fill="#ECEFF4">Raw logits z</text>
    <text x="96" y="300" font-size="18" fill="#7C8599">any real number · the scale is arbitrary · gaps matter, not values</text>
    <g stroke="#2A2F3C" stroke-width="1">
      <line x1="260" y1="330" x2="260" y2="770"></line><line x1="368" y1="330" x2="368" y2="770" stroke="#3A4152" stroke-width="2"></line><line x1="584" y1="330" x2="584" y2="770"></line><line x1="800" y1="330" x2="800" y2="770"></line>
    </g>
    <g font-family="IBM Plex Mono, monospace" font-size="16" fill="#7C8599" text-anchor="middle">
      <text x="260" y="792">-5</text><text x="368" y="792">0</text><text x="584" y="792">10</text><text x="800" y="792">20</text>
    </g>
    <g font-family="IBM Plex Mono, monospace" font-size="20">
      <text x="244" y="365" text-anchor="end" fill="#ECEFF4">{</text><rect x="368" y="350" width="393" height="20" rx="3" fill="#3987E5"></rect><text x="769" y="365" fill="#AEB6C7">18.2</text>
      <text x="244" y="400" text-anchor="end" fill="#ECEFF4">Sure</text><rect x="368" y="385" width="369" height="20" rx="3" fill="#3987E5"></rect><text x="745" y="400" fill="#AEB6C7">17.1</text>
      <text x="244" y="435" text-anchor="end" fill="#ECEFF4">Here</text><rect x="368" y="420" width="343" height="20" rx="3" fill="#3987E5"></rect><text x="719" y="435" fill="#AEB6C7">15.9</text>
      <text x="244" y="470" text-anchor="end" fill="#ECEFF4">⏎</text><rect x="368" y="455" width="309" height="20" rx="3" fill="#3987E5"></rect><text x="685" y="470" fill="#AEB6C7">14.3</text>
      <text x="244" y="505" text-anchor="end" fill="#ECEFF4">{"</text><rect x="368" y="490" width="298" height="20" rx="3" fill="#3987E5"></rect><text x="674" y="505" fill="#AEB6C7">13.8</text>
      <text x="244" y="540" text-anchor="end" fill="#ECEFF4">Ada</text><rect x="368" y="525" width="197" height="20" rx="3" fill="#3987E5"></rect><text x="573" y="540" fill="#AEB6C7">9.1</text>
      <text x="244" y="575" text-anchor="end" fill="#ECEFF4">The</text><rect x="368" y="560" width="181" height="20" rx="3" fill="#3987E5"></rect><text x="557" y="575" fill="#AEB6C7">8.4</text>
      <text x="244" y="610" text-anchor="end" fill="#ECEFF4">␠name</text><rect x="368" y="595" width="151" height="20" rx="3" fill="#3987E5"></rect><text x="527" y="610" fill="#AEB6C7">7.0</text>
      <text x="244" y="645" text-anchor="end" fill="#ECEFF4">**</text><rect x="368" y="630" width="119" height="20" rx="3" fill="#3987E5"></rect><text x="495" y="645" fill="#AEB6C7">5.5</text>
      <text x="244" y="680" text-anchor="end" fill="#ECEFF4">I</text><rect x="368" y="665" width="69" height="20" rx="3" fill="#3987E5"></rect><text x="445" y="680" fill="#AEB6C7">3.2</text>
      <text x="244" y="715" text-anchor="end" fill="#ECEFF4">`</text><rect x="338" y="700" width="30" height="20" rx="3" fill="#3987E5"></rect><text x="376" y="715" fill="#AEB6C7">-1.4</text>
      <text x="244" y="750" text-anchor="end" fill="#ECEFF4">Ok</text><rect x="303" y="735" width="65" height="20" rx="3" fill="#3987E5"></rect><text x="376" y="750" fill="#AEB6C7">-3.0</text>
    </g>
    <text x="96" y="826" font-size="18" fill="#7C8599">…and 151,924 more entries below, most of them negative</text>
  </g>

  <!-- middle arrow with formula -->
  <g>
    <line x1="860" y1="550" x2="1000" y2="550" stroke="#AEB6C7" stroke-width="3" marker-end="url(#arrow)"></line>
    <text x="930" y="520" text-anchor="middle" font-size="22" fill="#ECEFF4">softmax</text>
    <text x="930" y="590" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" fill="#7C8599">T = 1</text>
  </g>

  <!-- RIGHT: probabilities -->
  <g>
    <text x="1040" y="272" font-size="24" font-weight="600" fill="#ECEFF4">Probabilities p</text>
    <text x="1040" y="300" font-size="18" fill="#7C8599">between 0 and 1 · sum to 1 · a 1.1 logit gap became a 3× probability gap</text>
    <g stroke="#2A2F3C" stroke-width="1">
      <line x1="1200" y1="330" x2="1200" y2="770" stroke="#3A4152" stroke-width="2"></line><line x1="1345" y1="330" x2="1345" y2="770"></line><line x1="1490" y1="330" x2="1490" y2="770"></line><line x1="1635" y1="330" x2="1635" y2="770"></line><line x1="1780" y1="330" x2="1780" y2="770"></line>
    </g>
    <g font-family="IBM Plex Mono, monospace" font-size="16" fill="#7C8599" text-anchor="middle">
      <text x="1200" y="792">0%</text><text x="1345" y="792">25%</text><text x="1490" y="792">50%</text><text x="1635" y="792">75%</text><text x="1780" y="792">100%</text>
    </g>
    <g font-family="IBM Plex Mono, monospace" font-size="20">
      <text x="1184" y="365" text-anchor="end" fill="#ECEFF4">{</text><rect x="1200" y="350" width="396" height="20" rx="3" fill="#3987E5"></rect><text x="1604" y="365" fill="#AEB6C7">68.2%</text>
      <text x="1184" y="400" text-anchor="end" fill="#ECEFF4">Sure</text><rect x="1200" y="385" width="132" height="20" rx="3" fill="#3987E5"></rect><text x="1340" y="400" fill="#AEB6C7">22.7%</text>
      <text x="1184" y="435" text-anchor="end" fill="#ECEFF4">Here</text><rect x="1200" y="420" width="39" height="20" rx="3" fill="#3987E5"></rect><text x="1247" y="435" fill="#AEB6C7">6.8%</text>
      <text x="1184" y="470" text-anchor="end" fill="#ECEFF4">⏎</text><rect x="1200" y="455" width="8" height="20" rx="3" fill="#3987E5"></rect><text x="1216" y="470" fill="#AEB6C7">1.4%</text>
      <text x="1184" y="505" text-anchor="end" fill="#ECEFF4">{"</text><rect x="1200" y="490" width="5" height="20" rx="3" fill="#3987E5"></rect><text x="1213" y="505" fill="#AEB6C7">0.8%</text>
      <text x="1184" y="540" text-anchor="end" fill="#ECEFF4">Ada</text><rect x="1200" y="525" width="2" height="20" rx="1" fill="#3987E5"></rect><text x="1210" y="540" fill="#AEB6C7">0.008%</text>
      <text x="1184" y="575" text-anchor="end" fill="#ECEFF4">The</text><rect x="1200" y="560" width="2" height="20" rx="1" fill="#3987E5"></rect><text x="1210" y="575" fill="#AEB6C7">0.004%</text>
      <text x="1184" y="610" text-anchor="end" fill="#ECEFF4">␠name</text><rect x="1200" y="595" width="2" height="20" rx="1" fill="#3987E5"></rect><text x="1210" y="610" fill="#AEB6C7">0.001%</text>
      <text x="1184" y="645" text-anchor="end" fill="#ECEFF4">**</text><rect x="1200" y="630" width="2" height="20" rx="1" fill="#3987E5"></rect><text x="1210" y="645" fill="#AEB6C7">0.0002%</text>
      <text x="1184" y="680" text-anchor="end" fill="#ECEFF4">I</text><rect x="1200" y="665" width="2" height="20" rx="1" fill="#3987E5"></rect><text x="1210" y="680" fill="#AEB6C7">0.00002%</text>
      <text x="1184" y="715" text-anchor="end" fill="#ECEFF4">`</text><rect x="1200" y="700" width="2" height="20" rx="1" fill="#3987E5"></rect><text x="1210" y="715" fill="#AEB6C7">≈0</text>
      <text x="1184" y="750" text-anchor="end" fill="#ECEFF4">Ok</text><rect x="1200" y="735" width="2" height="20" rx="1" fill="#3987E5"></rect><text x="1210" y="750" fill="#AEB6C7">≈0</text>
    </g>
    <text x="1040" y="826" font-size="18" fill="#7C8599">the long tail still holds real mass in aggregate; sampling occasionally lands there</text>
  </g>

  <!-- footer -->
  <rect x="96" y="860" width="1728" height="120" rx="12" fill="#171A22" stroke="#2A2F3C"></rect>
  <text x="128" y="906" font-size="26" font-weight="600" fill="#ECEFF4">A prompt can make "{" likely. It cannot make "Sure" impossible.</text>
  <text x="128" y="946" font-size="24" fill="#AEB6C7">With 22.7% on "Sure, here is the JSON…", one run in four breaks your parser. Structured output removes that mass, it does not persuade it away.</text>
</svg>
