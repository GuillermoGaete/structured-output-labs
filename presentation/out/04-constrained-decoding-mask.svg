<?xml version="1.0" encoding="UTF-8"?>
<svg class="slide" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Constrained decoding in three columns: the raw logits, the same vector after every token the automaton forbids has been set to minus infinity, and the resulting probabilities where forbidden tokens are exactly zero and the allowed ones are renormalised">
<style>@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: block; src: url('../fonts/IBMPlexMono-400.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: block; src: url('../fonts/IBMPlexMono-500.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; font-display: block; src: url('../fonts/IBMPlexSans-400.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 500; font-display: block; src: url('../fonts/IBMPlexSans-500.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; font-display: block; src: url('../fonts/IBMPlexSans-600.woff2') format('woff2'); }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#AEB6C7"></path>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#4A4F5C" stroke-width="3"></line>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#0E1016"></rect>

  <text x="96" y="92" font-family="IBM Plex Mono, monospace" font-size="22" fill="#7C8599" letter-spacing="2">04 · CONSTRAINED DECODING</text>
  <text x="96" y="152" font-size="52" font-weight="600" fill="#ECEFF4">Write −∞ over everything the schema forbids</text>
  <text x="96" y="196" font-size="26" fill="#AEB6C7">Same step as before. The automaton for the schema is in its initial state, where the only legal next tokens start with “{”.</text>

  <text x="96" y="272" font-size="24" font-weight="600" fill="#ECEFF4">1 · Raw logits</text>
  <text x="96" y="300" font-size="18" fill="#7C8599">what the model computed</text>
  <text x="700" y="272" font-size="24" font-weight="600" fill="#ECEFF4">2 · After the mask</text>
  <text x="700" y="300" font-size="18" fill="#7C8599">logits[forbidden] = −∞ · a LogitsProcessor did this</text>
  <text x="1310" y="272" font-size="24" font-weight="600" fill="#ECEFF4">3 · Forced probabilities</text>
  <text x="1310" y="300" font-size="18" fill="#7C8599">softmax of column 2 · exp(−∞) = 0</text>

  <g font-family="IBM Plex Mono, monospace" font-size="20">
    <g>
      <text x="192" y="365" text-anchor="end" fill="#ECEFF4">{</text><rect x="250" y="350" width="291" height="20" rx="3" fill="#3987E5"></rect><text x="549" y="365" fill="#AEB6C7">18.2</text>
      <text x="192" y="400" text-anchor="end" fill="#ECEFF4">Sure</text><rect x="250" y="385" width="274" height="20" rx="3" fill="#3987E5"></rect><text x="532" y="400" fill="#AEB6C7">17.1</text>
      <text x="192" y="435" text-anchor="end" fill="#ECEFF4">Here</text><rect x="250" y="420" width="254" height="20" rx="3" fill="#3987E5"></rect><text x="512" y="435" fill="#AEB6C7">15.9</text>
      <text x="192" y="470" text-anchor="end" fill="#ECEFF4">⏎</text><rect x="250" y="455" width="229" height="20" rx="3" fill="#3987E5"></rect><text x="487" y="470" fill="#AEB6C7">14.3</text>
      <text x="192" y="505" text-anchor="end" fill="#ECEFF4">{"</text><rect x="250" y="490" width="221" height="20" rx="3" fill="#3987E5"></rect><text x="479" y="505" fill="#AEB6C7">13.8</text>
      <text x="192" y="540" text-anchor="end" fill="#ECEFF4">Ada</text><rect x="250" y="525" width="146" height="20" rx="3" fill="#3987E5"></rect><text x="404" y="540" fill="#AEB6C7">9.1</text>
      <text x="192" y="575" text-anchor="end" fill="#ECEFF4">The</text><rect x="250" y="560" width="134" height="20" rx="3" fill="#3987E5"></rect><text x="392" y="575" fill="#AEB6C7">8.4</text>
      <text x="192" y="610" text-anchor="end" fill="#ECEFF4">␠name</text><rect x="250" y="595" width="112" height="20" rx="3" fill="#3987E5"></rect><text x="370" y="610" fill="#AEB6C7">7.0</text>
      <text x="192" y="645" text-anchor="end" fill="#ECEFF4">**</text><rect x="250" y="630" width="88" height="20" rx="3" fill="#3987E5"></rect><text x="346" y="645" fill="#AEB6C7">5.5</text>
      <text x="192" y="680" text-anchor="end" fill="#ECEFF4">I</text><rect x="250" y="665" width="51" height="20" rx="3" fill="#3987E5"></rect><text x="309" y="680" fill="#AEB6C7">3.2</text>
      <text x="192" y="715" text-anchor="end" fill="#ECEFF4">`</text><rect x="228" y="700" width="22" height="20" rx="3" fill="#3987E5"></rect><text x="258" y="715" fill="#AEB6C7">-1.4</text>
      <text x="192" y="750" text-anchor="end" fill="#ECEFF4">Ok</text><rect x="202" y="735" width="48" height="20" rx="3" fill="#3987E5"></rect><text x="258" y="750" fill="#AEB6C7">-3.0</text>
    </g>
    <line x1="600" y1="550" x2="680" y2="550" stroke="#AEB6C7" stroke-width="3" marker-end="url(#arrow)"></line>
    <text x="640" y="530" text-anchor="middle" font-size="16" fill="#7C8599" font-family="IBM Plex Sans, sans-serif">mask</text>

    <g>
      <text x="796" y="365" text-anchor="end" fill="#ECEFF4">{</text><rect x="854" y="350" width="291" height="20" rx="3" fill="#D95926"></rect><text x="1153" y="365" fill="#AEB6C7">18.2</text>
      <text x="796" y="400" text-anchor="end" fill="#7C8599" text-decoration="line-through">Sure</text><rect x="854" y="385" width="274" height="20" rx="3" fill="url(#hatch)"></rect><text x="1136" y="400" fill="#F26D6D">−∞</text>
      <text x="796" y="435" text-anchor="end" fill="#7C8599" text-decoration="line-through">Here</text><rect x="854" y="420" width="254" height="20" rx="3" fill="url(#hatch)"></rect><text x="1116" y="435" fill="#F26D6D">−∞</text>
      <text x="796" y="470" text-anchor="end" fill="#7C8599" text-decoration="line-through">⏎</text><rect x="854" y="455" width="229" height="20" rx="3" fill="url(#hatch)"></rect><text x="1091" y="470" fill="#F26D6D">−∞</text>
      <text x="796" y="505" text-anchor="end" fill="#ECEFF4">{"</text><rect x="854" y="490" width="221" height="20" rx="3" fill="#D95926"></rect><text x="1083" y="505" fill="#AEB6C7">13.8</text>
      <text x="796" y="540" text-anchor="end" fill="#7C8599" text-decoration="line-through">Ada</text><rect x="854" y="525" width="146" height="20" rx="3" fill="url(#hatch)"></rect><text x="1008" y="540" fill="#F26D6D">−∞</text>
      <text x="796" y="575" text-anchor="end" fill="#7C8599" text-decoration="line-through">The</text><rect x="854" y="560" width="134" height="20" rx="3" fill="url(#hatch)"></rect><text x="996" y="575" fill="#F26D6D">−∞</text>
      <text x="796" y="610" text-anchor="end" fill="#7C8599" text-decoration="line-through">␠name</text><rect x="854" y="595" width="112" height="20" rx="3" fill="url(#hatch)"></rect><text x="974" y="610" fill="#F26D6D">−∞</text>
      <text x="796" y="645" text-anchor="end" fill="#7C8599" text-decoration="line-through">**</text><rect x="854" y="630" width="88" height="20" rx="3" fill="url(#hatch)"></rect><text x="950" y="645" fill="#F26D6D">−∞</text>
      <text x="796" y="680" text-anchor="end" fill="#7C8599" text-decoration="line-through">I</text><rect x="854" y="665" width="51" height="20" rx="3" fill="url(#hatch)"></rect><text x="913" y="680" fill="#F26D6D">−∞</text>
      <text x="796" y="715" text-anchor="end" fill="#7C8599" text-decoration="line-through">`</text><rect x="832" y="700" width="22" height="20" rx="3" fill="url(#hatch)"></rect><text x="862" y="715" fill="#F26D6D">−∞</text>
      <text x="796" y="750" text-anchor="end" fill="#7C8599" text-decoration="line-through">Ok</text><rect x="806" y="735" width="48" height="20" rx="3" fill="url(#hatch)"></rect><text x="862" y="750" fill="#F26D6D">−∞</text>
    </g>
    <line x1="1210" y1="550" x2="1290" y2="550" stroke="#AEB6C7" stroke-width="3" marker-end="url(#arrow)"></line>
    <text x="1250" y="530" text-anchor="middle" font-size="16" fill="#7C8599" font-family="IBM Plex Sans, sans-serif">softmax</text>

    <g>
      <text x="1424" y="365" text-anchor="end" fill="#ECEFF4">{</text><rect x="1444" y="350" width="395" height="20" rx="3" fill="#D95926"></rect><text x="1847" y="365" fill="#AEB6C7" font-size="18">98.8%</text>
      <text x="1424" y="400" text-anchor="end" fill="#7C8599">Sure</text><text x="1452" y="400" fill="#7C8599">0</text>
      <text x="1424" y="435" text-anchor="end" fill="#7C8599">Here</text><text x="1452" y="435" fill="#7C8599">0</text>
      <text x="1424" y="470" text-anchor="end" fill="#7C8599">⏎</text><text x="1452" y="470" fill="#7C8599">0</text>
      <text x="1424" y="505" text-anchor="end" fill="#ECEFF4">{"</text><rect x="1444" y="490" width="5" height="20" rx="2" fill="#D95926"></rect><text x="1457" y="505" fill="#AEB6C7">1.2%</text>
      <text x="1424" y="540" text-anchor="end" fill="#7C8599">Ada</text><text x="1452" y="540" fill="#7C8599">0</text>
      <text x="1424" y="575" text-anchor="end" fill="#7C8599">The</text><text x="1452" y="575" fill="#7C8599">0</text>
      <text x="1424" y="610" text-anchor="end" fill="#7C8599">␠name</text><text x="1452" y="610" fill="#7C8599">0</text>
      <text x="1424" y="645" text-anchor="end" fill="#7C8599">**</text><text x="1452" y="645" fill="#7C8599">0</text>
      <text x="1424" y="680" text-anchor="end" fill="#7C8599">I</text><text x="1452" y="680" fill="#7C8599">0</text>
      <text x="1424" y="715" text-anchor="end" fill="#7C8599">`</text><text x="1452" y="715" fill="#7C8599">0</text>
      <text x="1424" y="750" text-anchor="end" fill="#7C8599">Ok</text><text x="1452" y="750" fill="#7C8599">0</text>
    </g>
  </g>

  <text x="96" y="826" font-size="18" fill="#7C8599">"original intent": 31.0% of the mass sat on tokens the schema forbids</text>
  <text x="700" y="826" font-size="18" fill="#7C8599">allowed at this state: 2 of 151,936 tokens (the ones spelling "{")</text>
  <text x="1310" y="826" font-size="18" fill="#7C8599">the two survivors keep their ratio: 68.2 : 0.8 became 98.8 : 1.2</text>

  <rect x="96" y="860" width="1728" height="120" rx="12" fill="#171A22" stroke="#2A2F3C"></rect>
  <text x="128" y="906" font-size="26" font-weight="600" fill="#ECEFF4">The model still chooses; it chooses among what the grammar allows, with its own preferences intact.</text>
  <text x="128" y="946" font-size="24" fill="#AEB6C7">Forbidden tokens are not "unlikely", they are impossible: probability exactly 0, on every step, with no retries and no parsing failures.</text>
</svg>
