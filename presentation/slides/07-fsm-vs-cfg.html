<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>07 · Finite states vs a stack</title>
<link rel="stylesheet" href="_theme.css">
</head>
<body>
<svg class="slide" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left: a flat schema compiles to a finite automaton. Right: a recursive schema needs a grammar with a stack that pushes on every opening bracket and pops on every closing one; a regex can only unroll a fixed number of levels">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#AEB6C7"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#0E1016"/>

  <text x="96" y="92" font-family="IBM Plex Mono, monospace" font-size="22" fill="#7C8599" letter-spacing="2">07 · FSM vs CFG</text>
  <text x="96" y="152" font-size="52" font-weight="600" fill="#ECEFF4">A regex cannot count. A grammar carries a stack.</text>
  <text x="96" y="196" font-size="26" fill="#AEB6C7">Flat and nested schemas are still finite. Self-referencing schemas are not, and the engine has to change.</text>

  <g>
    <rect x="96" y="250" width="836" height="580" rx="14" fill="#171A22" stroke="#2A2F3C"/>
    <text x="124" y="292" font-size="24" font-weight="600" fill="#ECEFF4">Flat schema → finite-state machine</text>
    <text x="124" y="322" font-size="18" fill="#7C8599">outlines_core · regex → DFA over tokens · O(1) per step</text>
    <g font-family="IBM Plex Mono, monospace" font-size="19" fill="#ECEFF4">
      <text x="124" y="366">class Person(BaseModel):</text>
      <text x="124" y="394">&#160;&#160;&#160;&#160;name: str</text>
      <text x="124" y="422">&#160;&#160;&#160;&#160;age: int</text>
    </g>
    <g font-family="IBM Plex Mono, monospace" font-size="18">
      <g stroke="#AEB6C7" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
        <line x1="182" y1="530" x2="250" y2="530"/><line x1="318" y1="530" x2="386" y2="530"/><line x1="454" y1="530" x2="522" y2="530"/><line x1="590" y1="530" x2="658" y2="530"/><line x1="726" y1="530" x2="794" y2="530"/>
        <path d="M566,502 C534,440 598,440 566,502"/>
        <path d="M702,502 C670,440 734,440 702,502"/>
      </g>
      <g stroke-width="2.5" text-anchor="middle">
        <circle cx="148" cy="530" r="32" fill="#0E1016" stroke="#2DD4BF" stroke-width="4"/><text x="148" y="537" fill="#ECEFF4">0</text>
        <circle cx="284" cy="530" r="32" fill="#0E1016" stroke="#3A4152"/><text x="284" y="537" fill="#ECEFF4">1</text>
        <circle cx="420" cy="530" r="32" fill="#0E1016" stroke="#3A4152"/><text x="420" y="537" fill="#ECEFF4">2</text>
        <circle cx="556" cy="530" r="32" fill="#0E1016" stroke="#3A4152"/><text x="556" y="537" fill="#ECEFF4">3</text>
        <circle cx="692" cy="530" r="32" fill="#0E1016" stroke="#3A4152"/><text x="692" y="537" fill="#ECEFF4">4</text>
        <circle cx="828" cy="530" r="32" fill="#0E1016" stroke="#34D399"/><circle cx="828" cy="530" r="25" fill="none" stroke="#34D399"/><text x="828" y="537" fill="#ECEFF4">5</text>
      </g>
      <g fill="#ECEFF4" text-anchor="middle" font-size="16">
        <text x="216" y="488">{"name":"</text>
        <text x="352" y="488">…</text>
        <text x="488" y="488">","age":</text>
        <text x="624" y="488">[1-9]</text>
        <text x="760" y="488">}</text>
        <text x="566" y="452">chars</text>
        <text x="702" y="452">0-9</text>
      </g>
    </g>
    <text x="124" y="620" font-size="20" fill="#AEB6C7">Loops are fine: a loop is one state visiting itself.</text>
    <text x="124" y="652" font-size="20" fill="#AEB6C7">What an FSM cannot do is remember how many times.</text>
    <text x="124" y="684" font-size="20" fill="#AEB6C7">Arrays of objects, nested objects, enums, patterns: all finite, all FSM.</text>
    <rect x="124" y="716" width="780" height="88" rx="10" fill="#0E1016" stroke="#2A2F3C"/>
    <text x="148" y="750" font-size="19" fill="#ECEFF4">Recursive schema in outlines_core 0.2: the regex is <tspan fill="#2DD4BF">unrolled 3 levels</tspan> and then cut.</text>
    <text x="148" y="782" font-size="19" fill="#AEB6C7">Still an FSM, still fast; a 4th level of nesting is simply forbidden.</text>
  </g>

  <g>
    <rect x="988" y="250" width="836" height="580" rx="14" fill="#171A22" stroke="#2A2F3C"/>
    <text x="1016" y="292" font-size="24" font-weight="600" fill="#ECEFF4">Recursive schema → context-free grammar</text>
    <text x="1016" y="322" font-size="18" fill="#7C8599">llguidance · grammar with a pushdown stack · nests as deep as the model goes</text>
    <g font-family="IBM Plex Mono, monospace" font-size="19" fill="#ECEFF4">
      <text x="1016" y="366">class TreeNode(BaseModel):</text>
      <text x="1016" y="394">&#160;&#160;&#160;&#160;value: int</text>
      <text x="1016" y="422">&#160;&#160;&#160;&#160;children: list[<tspan fill="#2DD4BF">"TreeNode"</tspan>]</text>
    </g>
    <g font-family="IBM Plex Mono, monospace" font-size="16" fill="#AEB6C7">
      <text x="1016" y="470"><tspan fill="#ECEFF4">node</tspan>  := "{" "value" ":" int "," "children" ":" "[" <tspan fill="#2DD4BF">node</tspan> ("," <tspan fill="#2DD4BF">node</tspan>)* "]" "}"</text>
      <text x="1016" y="498">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;| "{" "value" ":" int "," "children" ":" "[" "]" "}"</text>
    </g>
    <text x="1016" y="548" font-size="18" fill="#7C8599">Generated so far</text>
    <rect x="1016" y="562" width="574" height="52" rx="8" fill="#0E1016" stroke="#2A2F3C"/>
    <text x="1032" y="596" font-family="IBM Plex Mono, monospace" font-size="20" fill="#ECEFF4">{"value":1,"children":[{"value":2,"children":[<tspan fill="#D95926">▮</tspan></text>
    <text x="1660" y="548" font-size="18" fill="#7C8599" text-anchor="middle">stack</text>
    <g font-family="IBM Plex Mono, monospace" font-size="22" text-anchor="middle">
      <rect x="1610" y="562" width="100" height="40" rx="6" fill="#D95926"/><text x="1660" y="590" fill="#0E1016">[</text>
      <rect x="1610" y="608" width="100" height="40" rx="6" fill="#1E2330" stroke="#3A4152"/><text x="1660" y="636" fill="#ECEFF4">{</text>
      <rect x="1610" y="654" width="100" height="40" rx="6" fill="#1E2330" stroke="#3A4152"/><text x="1660" y="682" fill="#ECEFF4">[</text>
      <rect x="1610" y="700" width="100" height="40" rx="6" fill="#1E2330" stroke="#3A4152"/><text x="1660" y="728" fill="#ECEFF4">{</text>
    </g>
    <text x="1660" y="770" font-size="17" fill="#7C8599" text-anchor="middle">depth 4</text>
    <text x="1016" y="650" font-size="20" fill="#AEB6C7">Every "{" or "[" pushes; every "}" or "]" pops.</text>
    <text x="1016" y="682" font-size="20" fill="#AEB6C7">"]" is only allowed when the top of the stack is "[".</text>
    <text x="1016" y="714" font-size="20" fill="#AEB6C7">The lab shows this depth per token as the stack-depth trace.</text>
    <rect x="1016" y="746" width="560" height="58" rx="10" fill="#0E1016" stroke="#2A2F3C"/>
    <text x="1040" y="782" font-size="19" fill="#ECEFF4">Cost: an Earley-style parser per step instead of a table lookup.</text>
  </g>

  <rect x="96" y="860" width="1728" height="120" rx="12" fill="#171A22" stroke="#2A2F3C"/>
  <text x="128" y="906" font-size="26" font-weight="600" fill="#ECEFF4">Pick the engine by the schema's shape: FSM when it is finite, CFG when it refers to itself.</text>
  <text x="128" y="946" font-size="24" fill="#AEB6C7">Both produce the same kind of mask on the logits. They differ in how they decide what the next allowed tokens are.</text>
</svg>
</body>
</html>
