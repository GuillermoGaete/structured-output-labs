<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>05 · Walking the automaton</title>
<link rel="stylesheet" href="_theme.css">
</head>
<body>
<svg class="slide" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The finite-state machine for the schema {age: integer}: a chain of states for the fixed characters, a loop for the digits, and a final state; the current state after the colon is highlighted, its outgoing edges are the only allowed tokens">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#AEB6C7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D95926"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#0E1016"/>

  <text x="96" y="92" font-family="IBM Plex Mono, monospace" font-size="22" fill="#7C8599" letter-spacing="2">05 · FINITE-STATE MACHINE</text>
  <text x="96" y="152" font-size="52" font-weight="600" fill="#ECEFF4">Where the mask comes from: a state and its edges</text>
  <text x="96" y="196" font-size="26" fill="#AEB6C7">Schema {"age": integer} → outlines regex</text>
  <text x="640" y="196" font-family="IBM Plex Mono, monospace" font-size="24" fill="#2DD4BF">\{"age":(0|[1-9][0-9]*)\}</text>
  <text x="1040" y="196" font-size="26" fill="#AEB6C7">→ interegular FSM (character level, whitespace omitted)</text>

  <g font-family="IBM Plex Mono, monospace">
    <g stroke="#AEB6C7" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <line x1="168" y1="420" x2="262" y2="420"/>
      <line x1="338" y1="420" x2="432" y2="420"/>
      <line x1="508" y1="420" x2="602" y2="420"/>
      <line x1="678" y1="420" x2="772" y2="420"/>
      <line x1="848" y1="420" x2="1112" y2="420"/>
    </g>
    <g stroke="#D95926" stroke-width="3" fill="none" marker-end="url(#arrow-orange)">
      <line x1="1188" y1="400" x2="1300" y2="330"/>
      <line x1="1188" y1="440" x2="1300" y2="510"/>
    </g>
    <g stroke="#AEB6C7" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <line x1="1376" y1="330" x2="1530" y2="400"/>
      <line x1="1376" y1="510" x2="1530" y2="440"/>
      <path d="M1328,476 C1290,560 1386,560 1348,476"/>
    </g>
    <g font-size="24" fill="#ECEFF4" text-anchor="middle">
      <text x="215" y="404">{</text>
      <text x="385" y="404">"</text>
      <text x="555" y="404">a g e</text>
      <text x="725" y="404">"</text>
      <text x="980" y="404">:</text>
      <text x="1230" y="340" fill="#D95926">0</text>
      <text x="1230" y="506" fill="#D95926">1-9</text>
      <text x="1470" y="352">}</text>
      <text x="1470" y="500">}</text>
      <text x="1338" y="580">0-9</text>
    </g>
    <g stroke-width="2.5" font-size="22" text-anchor="middle">
      <circle cx="130" cy="420" r="38" fill="#171A22" stroke="#2DD4BF" stroke-width="4"/><text x="130" y="428" fill="#ECEFF4">0</text>
      <circle cx="300" cy="420" r="38" fill="#171A22" stroke="#3A4152"/><text x="300" y="428" fill="#ECEFF4">1</text>
      <circle cx="470" cy="420" r="38" fill="#171A22" stroke="#3A4152"/><text x="470" y="428" fill="#ECEFF4">2</text>
      <circle cx="640" cy="420" r="38" fill="#171A22" stroke="#3A4152"/><text x="640" y="428" fill="#ECEFF4">5</text>
      <circle cx="810" cy="420" r="38" fill="#171A22" stroke="#3A4152"/><text x="810" y="428" fill="#ECEFF4">6</text>
      <circle cx="1150" cy="420" r="38" fill="#D95926" stroke="#D95926"/><text x="1150" y="428" fill="#0E1016" font-weight="500">7</text>
      <circle cx="1338" cy="330" r="38" fill="#171A22" stroke="#3A4152"/><text x="1338" y="338" fill="#ECEFF4">9</text>
      <circle cx="1338" cy="510" r="38" fill="#171A22" stroke="#3A4152"/><text x="1338" y="518" fill="#ECEFF4">8</text>
      <circle cx="1568" cy="420" r="38" fill="#171A22" stroke="#34D399"/><circle cx="1568" cy="420" r="30" fill="none" stroke="#34D399"/><text x="1568" y="428" fill="#ECEFF4">10</text>
    </g>
    <text x="130" y="486" text-anchor="middle" font-size="16" fill="#2DD4BF" font-family="IBM Plex Sans, sans-serif">initial</text>
    <text x="1150" y="486" text-anchor="middle" font-size="16" fill="#D95926" font-family="IBM Plex Sans, sans-serif">current</text>
    <text x="1568" y="486" text-anchor="middle" font-size="16" fill="#34D399" font-family="IBM Plex Sans, sans-serif">final → only ⟨eos⟩</text>
    <text x="640" y="486" text-anchor="middle" font-size="16" fill="#7C8599" font-family="IBM Plex Sans, sans-serif">states 3 and 4 collapsed</text>
  </g>

  <g>
    <text x="96" y="640" font-size="22" fill="#7C8599">Generated so far</text>
    <rect x="96" y="656" width="560" height="64" rx="10" fill="#171A22" stroke="#2A2F3C"/>
    <text x="120" y="698" font-family="IBM Plex Mono, monospace" font-size="30" fill="#ECEFF4">{"age":<tspan fill="#D95926">▮</tspan></text>
    <text x="96" y="760" font-size="20" fill="#AEB6C7">outlines_core walks this automaton over whole tokens:</text>
    <text x="96" y="790" font-size="20" fill="#AEB6C7">at state 7 it looks up the precomputed set of tokens</text>
    <text x="96" y="820" font-size="20" fill="#AEB6C7">that can start a valid integer.</text>
  </g>

  <g>
    <rect x="720" y="640" width="530" height="180" rx="12" fill="#171A22" stroke="#D95926"/>
    <text x="744" y="676" font-size="20" fill="#D95926">Allowed at state 7 · 1,126 tokens</text>
    <g font-family="IBM Plex Mono, monospace" font-size="22" fill="#ECEFF4">
      <text x="744" y="718">0  1  2  …  9   12   36   100   1985</text>
      <text x="744" y="754">2024   360   77   ␠3   ␠36   ␠2000</text>
    </g>
    <text x="744" y="796" font-size="18" fill="#7C8599">every token whose characters keep the regex alive</text>

    <rect x="1290" y="640" width="534" height="180" rx="12" fill="#171A22" stroke="#4A4F5C"/>
    <text x="1314" y="676" font-size="20" fill="#7C8599">Forbidden · the other 150,810 tokens</text>
    <g font-family="IBM Plex Mono, monospace" font-size="22" fill="#7C8599">
      <text x="1314" y="718" text-decoration="line-through">"36"   thirty   ␠"   null   ␠-   ⏎</text>
      <text x="1314" y="754" text-decoration="line-through">years   Ada   {   }   ⟨eos⟩   …</text>
    </g>
    <text x="1314" y="796" font-size="18" fill="#7C8599">logit → −∞, probability → 0</text>
  </g>

  <rect x="96" y="860" width="1728" height="120" rx="12" fill="#171A22" stroke="#2A2F3C"/>
  <text x="128" y="906" font-size="26" font-weight="600" fill="#ECEFF4">The mask is not computed from the text; it is read off the current state.</text>
  <text x="128" y="946" font-size="24" fill="#AEB6C7">state → allowed token set is built once per (schema, vocabulary) pair and cached. Per step, applying it costs a bitmask over the logits.</text>
</svg>
</body>
</html>
