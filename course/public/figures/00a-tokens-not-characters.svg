  <text x="96" y="92" font-family="IBM Plex Mono, monospace" font-size="22" fill="#7C8599" letter-spacing="2">00a · TOKENIZATION</text>
  <text x="96" y="152" font-size="52" font-weight="600" fill="#ECEFF4">Tokens, not characters</text>
