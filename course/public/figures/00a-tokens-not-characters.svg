<svg class="slide" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The same JSON object shown as 26 characters and as the 13 byte-level BPE tokens Qwen2.5 splits it into, with token ids; call-outs show that a brace and a quote merge into one token, that a quote and a colon straddle the key/value boundary, and that a space followed by 36 is three tokens; a panel explains BPE merges and the glyphs for space, newline and tab">
