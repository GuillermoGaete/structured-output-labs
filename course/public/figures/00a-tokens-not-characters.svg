  <rect x="96" y="616" width="1050" height="214" rx="12" fill="#171A22" stroke="#2A2F3C"></rect>
  <text x="120" y="652" font-size="20" fill="#7C8599">How the vocabulary was built · byte-level BPE</text>
  <g font-size="19" fill="#AEB6C7">
    <text x="120" y="692">start from the 256 byte values</text>
    <text x="120" y="722">merge the most frequent adjacent pair into a new entry; repeat</text>
    <text x="120" y="752">151,387 merges later: 151,643 entries, plus 22 special tokens</text>
    <text x="120" y="782">the model only ever sees the ids; the strings live in the tokenizer</text>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="18">
    <text x="760" y="680" fill="#7C8599" font-family="IBM Plex Sans, sans-serif" font-size="16">the entry for " is"</text>
    <rect x="760" y="692" width="34" height="30" rx="4" fill="#1E2330" stroke="#2A2F3C"></rect><text x="777" y="713" text-anchor="middle" fill="#ECEFF4">Ġ</text>
    <rect x="800" y="692" width="34" height="30" rx="4" fill="#1E2330" stroke="#2A2F3C"></rect><text x="817" y="713" text-anchor="middle" fill="#ECEFF4">i</text>
    <rect x="840" y="692" width="34" height="30" rx="4" fill="#1E2330" stroke="#2A2F3C"></rect><text x="857" y="713" text-anchor="middle" fill="#ECEFF4">s</text>
    <text x="900" y="713" fill="#7C8599" font-family="IBM Plex Sans, sans-serif" font-size="16">three bytes</text>
    <rect x="760" y="732" width="34" height="30" rx="4" fill="#1E2330" stroke="#2A2F3C"></rect><text x="777" y="753" text-anchor="middle" fill="#ECEFF4">Ġ</text>
    <rect x="800" y="732" width="74" height="30" rx="4" fill="#1E2330" stroke="#2A2F3C"></rect><text x="837" y="753" text-anchor="middle" fill="#ECEFF4">is</text>
    <text x="900" y="753" fill="#7C8599" font-family="IBM Plex Sans, sans-serif" font-size="16">merge #29: i + s</text>
    <rect x="760" y="772" width="114" height="30" rx="4" fill="#1E2330" stroke="#2DD4BF"></rect><text x="817" y="793" text-anchor="middle" fill="#2DD4BF">Ġis</text>
    <text x="900" y="793" fill="#7C8599" font-family="IBM Plex Sans, sans-serif" font-size="16">merge #118: Ġ + is → id 374</text>
  </g>

  <rect x="1170" y="616" width="654" height="214" rx="12" fill="#171A22" stroke="#2A2F3C"></rect>
  <text x="1194" y="652" font-size="20" fill="#7C8599">The glyphs</text>
  <g font-size="19" fill="#AEB6C7">
    <text x="1194" y="692"><tspan font-family="IBM Plex Mono, monospace" fill="#ECEFF4">Ġ</tspan> = a leading space (byte 0x20)</text>
    <text x="1194" y="722"><tspan font-family="IBM Plex Mono, monospace" fill="#ECEFF4">Ċ</tspan> = newline · <tspan font-family="IBM Plex Mono, monospace" fill="#ECEFF4">ĉ</tspan> = tab</text>
    <text x="1194" y="752">only in the string form of the vocabulary</text>
    <text x="1194" y="782">print a raw token and you see them; the model never does</text>
  </g>

  <rect x="96" y="860" width="1728" height="120" rx="12" fill="#171A22" stroke="#2A2F3C"></rect>
  <text x="128" y="906" font-size="26" font-weight="600" fill="#ECEFF4">The model reads and writes whole tokens. So must anything that constrains it.</text>
  <text x="128" y="946" font-size="24" fill="#AEB6C7">The automaton runs over tokens, not characters: <tspan font-family="IBM Plex Mono, monospace">":</tspan> is one edge, not two (figure 05).</text>
</svg>
